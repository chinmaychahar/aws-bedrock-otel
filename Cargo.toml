[package]
name = "aws-bedrock-otel"
version = "0.1.0"
edition = "2024"
rust-version = "1.94.1"
description = "OpenTelemetry GenAI instrumentation for the AWS SDK for Rust Bedrock Runtime client"
license = "Apache-2.0"
repository = "https://github.com/chinmaychahar/aws-bedrock-otel"
readme = "README.md"
keywords = ["opentelemetry", "aws", "bedrock", "genai", "tracing"]
categories = ["development-tools::debugging", "development-tools::profiling"]

[dependencies]
aws-sdk-bedrockruntime = { version = "1.147.0", default-features = false }
aws-smithy-runtime-api = { version = "1.18.0", features = ["client"] }
aws-smithy-types = "1.8.1"
opentelemetry = { version = "0.33.0", default-features = false, features = ["trace"] }

[dev-dependencies]
aws-config = "1.12.0"
aws-sdk-bedrockruntime = { version = "1.147.0", features = ["test-util"] }
aws-smithy-mocks = "0.3.0"
opentelemetry_sdk = { version = "0.33.0", features = ["testing", "trace"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }
